allowBuilds:
  esbuild: true
  workerd: true

# pnpm settings for this project.

# Solid 2 is a release candidate whose packages are released together and
# often: a release-age policy would refuse the versions pinned in package.json
# on the day they come out. Remove this once Solid 2 is stable.
minimumReleaseAgeExclude:
  - solid-js
  - "@solidjs/*"
  - filesystem-routing

# @stylexjs/unplugin 0.19.1 declares `unplugin ^2.3.11` and has not released a version
# that widens it. unplugin 3.x works with it (see docs/solid2-stylex.md, "版本"), so the
# mismatch is allowed here instead of warned about on every install. Remove this once
# StyleX widens its range.
peerDependencyRules:
  allowedVersions:
    "@stylexjs/unplugin>unplugin": "3"
