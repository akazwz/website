[tools]
node = "26.13.0"
pnpm = "12.16.1"

[tasks.dev]
description = "Start the Vite dev server"
run = "pnpm dev"

[tasks.build]
description = "Prerender the site into dist/client"
run = "pnpm build"

[tasks.format]
description = "Format the sources with oxfmt"
run = "pnpm format"

[tasks.check]
description = "Format check (oxfmt), type check (tsc) and lint (oxlint), changing nothing"
run = "pnpm check"
