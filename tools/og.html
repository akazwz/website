<!doctype html>
<!--
  The link preview image, public/og.png. Same look as the site in its dark appearance: a dot, the name, one line.
  To regenerate it, open this file in a browser at a 1200×630 viewport with a device scale
  factor of 2 and save a screenshot as public/og.png (2400×1260).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0a0a0a;
        color: #ededed;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 88px 96px;
      }
      .dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #ededed;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 104px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      p {
        margin: 0;
        color: #a0a0a0;
        font-size: 36px;
        line-height: 1.35;
      }
      .domain {
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot"></div>
      <div>
        <h1>akazwz</h1>
        <p>Full-stack developer working on AI agents.</p>
      </div>
      <p class="domain">akazwz.com</p>
    </main>
  </body>
</html>
